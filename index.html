<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="description" content="Jo — training & macro plan">
<title>Jo Training</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,textarea,select{font-family:inherit;color:inherit;background:none;border:none;outline:none}
input[type=checkbox]{accent-color:var(--accent)}
:root{
  --bg:#000000;
  --surface:#141414;
  --surface2:#1E1E1E;
  --surface3:#2B2B2B;
  --header:#2E2E2E;
  --line:#242424;
  --text:#FFFFFF;
  --text2:#9C9C9C;
  --text3:#6E6E6E;
  --accent:#9A9B72;
  --accent-soft:rgba(154,155,114,.16);
  --kcal:#4285F4;
  --pro:#00A854;
  --carb:#FF9500;
  --fat:#E8138C;
  --red:#E5484D;
  --brand-ink:#111111;
  --brand-tan:#B98A55;
  --green:#3AC267;
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --hdr:72px;
  --tab:104px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.35;position:fixed;inset:0;overflow:hidden;font-size:15px}

/* ---------- header ---------- */
.hdr{position:fixed;top:0;left:0;right:0;z-index:90;background:var(--header);padding-top:var(--safe-t);
     display:flex;align-items:center;justify-content:center;height:calc(var(--hdr) + var(--safe-t));padding-left:16px;padding-right:16px}
.hdr.plain{background:var(--bg);justify-content:flex-start}
.hdr-title{font-size:19px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;text-align:center}
.hdr-back{position:absolute;left:10px;top:calc(var(--safe-t) + 9px);width:52px;height:52px;border-radius:50%;
          display:flex;align-items:center;justify-content:center;color:var(--text)}
.hdr-back:active{opacity:.6}
.hdr-btn{position:absolute;right:16px;top:calc(var(--safe-t) + 8px);width:52px;height:52px;border-radius:50%;
         background:#3A3A3A;display:flex;align-items:center;justify-content:center;color:var(--text)}
.hdr-btn:active{opacity:.7}

/* ---------- scroll area ---------- */
#app{position:fixed;left:0;right:0;top:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
     padding-bottom:calc(var(--tab) + var(--safe-b));scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
#app.has-hdr{padding-top:calc(var(--hdr) + var(--safe-t))}
#app.no-hdr{padding-top:calc(var(--safe-t) + 12px)}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 10px);height:72px;background:#161616;
        border-radius:999px;display:flex;align-items:center;justify-content:space-around;z-index:100;
        box-shadow:0 8px 28px rgba(0,0,0,.6)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text2);
     min-width:62px;padding:0 10px;height:60px;border-radius:999px;transition:background .15s,color .15s}
.tab span{font-size:11px;font-weight:500}
.tab.active{color:var(--accent);background:#2A2A2A;padding:0 20px}
.tab:active{opacity:.75}

/* ---------- generic ---------- */
.sec{padding:0 18px}
.sec-t{font-size:19px;font-weight:600;margin:24px 0 12px}
.card{background:var(--surface);border-radius:16px;padding:16px}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.muted{color:var(--text2)}
.dim{color:var(--text3)}
.t-xs{font-size:11px}.t-sm{font-size:13px}.t-md{font-size:15px}.t-lg{font-size:18px}.t-xl{font-size:22px}.t-2xl{font-size:28px}
.w6{font-weight:600}.w5{font-weight:500}.w7{font-weight:700}
.divider{height:1px;background:var(--line)}
.btn-accent{width:100%;background:var(--accent);color:#1A1A12;font-weight:600;font-size:17px;padding:16px;border-radius:12px}
.btn-accent:active{opacity:.85}
.link{color:var(--accent);font-weight:500;font-size:16px}
.chip{display:inline-block;background:var(--surface3);border-radius:8px;padding:6px 10px;font-size:12px;color:#D8D8D8;margin:0 6px 6px 0}
.empty{color:var(--text3);font-size:14px;padding:28px 0;text-align:center}

/* ---------- home ---------- */
.greet{display:flex;align-items:center;gap:12px;padding:8px 18px 4px}
.logo{height:56px;padding:0 13px;border-radius:12px;background:#fff;display:flex;align-items:center;
      justify-content:center;flex-shrink:0}
.wordmark{font-family:'Archivo Black',sans-serif;font-size:16px;letter-spacing:-.6px;line-height:1;white-space:nowrap}
.wordmark .k{color:var(--brand-ink)}
.wordmark .t{color:var(--brand-tan)}
.greet-act{margin-left:auto;display:flex;gap:16px;color:var(--text)}
.daystrip{display:flex;gap:8px;padding:0 18px;overflow-x:auto;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.daycell{flex:1;min-width:44px;background:var(--surface);border-radius:12px;padding:10px 4px;text-align:center;border:1.5px solid transparent}
.daycell.today{border-color:var(--accent)}
.daycell.future{opacity:.4}
.daycell .dot{width:26px;height:26px;border-radius:50%;background:#1F1F1F;margin:0 auto 8px;display:flex;
              align-items:center;justify-content:center;color:transparent}
.daycell.done .dot{background:#2A2A2A;color:#8F8F8F}
.daycell .dn{font-size:11px;font-weight:600;letter-spacing:.4px}
.daycell .dd{font-size:11px;color:var(--text3)}
.streak{color:var(--kcal);font-weight:600;font-size:14px;letter-spacing:.4px;padding:14px 18px 0}
.tile{background:var(--surface);border-radius:16px;padding:14px;min-height:150px;display:flex;flex-direction:column}
.tile-l{font-size:11px;letter-spacing:.8px;color:var(--text2);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;gap:12px;padding:0 18px}
.span2{grid-row:span 2}
.waterbar{width:26px;flex:0 0 26px;margin-left:8px;background:#262626;border-radius:999px;position:relative;overflow:hidden;min-height:110px}
.waterfill{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:999px}
.stepbtn{width:38px;height:38px;border-radius:50%;background:#262626;display:flex;align-items:center;justify-content:center;font-size:20px}

/* ---------- workout ---------- */
.ovbar{margin:14px 18px;background:var(--surface);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:12px}
.ovbar .ic{width:34px;height:34px;border-radius:9px;background:#262622;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.daytabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding:0 18px}
.daytabs::-webkit-scrollbar{display:none}
.daytab{white-space:nowrap;padding:14px 16px 12px;color:var(--text2);font-size:16px;font-weight:500;border-bottom:2px solid transparent}
.daytab.active{color:var(--accent);border-bottom-color:var(--accent)}
.blk-t{color:var(--text2);font-size:17px;font-weight:500;padding:22px 18px 10px}
.excard{background:var(--surface);border-radius:14px;margin:0 18px 12px;padding:16px}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.exthumb{width:72px;height:52px;border-radius:8px;object-fit:cover;background:#fff;flex-shrink:0}
.exname{font-size:16.5px;font-weight:600;line-height:1.3}
.letter{min-width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;
        align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
.exnote{display:flex;gap:10px;align-items:flex-start;color:var(--text2);font-size:14px;margin-top:12px}
.exnote p{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.exnote.open p{-webkit-line-clamp:unset;display:block}
.exnote .cv{transition:transform .2s;color:#8A8AA0;flex-shrink:0;margin-top:2px}
.exnote.open .cv{transform:rotate(180deg)}
.exsep{height:1px;background:var(--line);margin:14px 0}
.logbar{position:fixed;left:18px;right:18px;bottom:calc(var(--safe-b) + 94px);z-index:80}

/* ---------- nutrition ---------- */
.datebar{display:flex;align-items:center;gap:12px;padding:20px 18px 4px}
.arrow{width:34px;height:30px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--text)}
.datelbl{font-size:17px;min-width:110px;text-align:center}
.alldays{flex:1;text-align:center;color:var(--accent);font-size:17px;letter-spacing:.3px}
.alldays.on{color:#D9DAB0;font-weight:600}
.summary{display:flex;align-items:center;gap:8px;padding:14px 18px 6px}
.sumlines{flex:1;font-size:17px;line-height:1.62}
.sumlines b{font-weight:400}
.rings{width:145px;height:145px;flex-shrink:0;margin-right:24px}
.dots{display:flex;justify-content:center;gap:10px;padding:10px 0 4px}
.dots i{width:8px;height:8px;border-radius:50%;background:#5A5A4A;display:block}
.dots i.on{background:var(--accent)}
.meal{border-top:1px solid var(--line);padding:18px 18px 14px}
.mealhead{display:flex;align-items:flex-start;gap:12px}
.mealname{font-size:21px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.micons{display:flex;gap:8px;align-items:center;flex-shrink:0;padding-top:4px}
.micons svg{width:22px;height:22px}
.macrohdr{display:flex;justify-content:flex-end;gap:0;margin:14px 0 4px}
.mh{width:16%;text-align:center;font-size:13px;color:#DADADA;white-space:nowrap}
.mh u{display:block;height:3px;border-radius:2px;margin:7px auto 0;width:30px;text-decoration:none}
.foodrow{display:flex;align-items:center;gap:4px;padding:14px 0;border-top:1px solid var(--line)}
.foodname{flex:1;min-width:0;font-size:16px;line-height:1.35;padding-right:6px}
.foodqty{color:var(--text2);font-size:14px;margin-top:2px}
.fv{width:16%;text-align:center;font-size:16px}
.mealfoot{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--line);margin-top:0}
.mealdone{display:flex;align-items:center;gap:14px;padding:16px 18px;border-top:1px solid var(--line)}
.mealdone .chk{color:var(--green);flex-shrink:0}
.mealdone .nm{flex:1;min-width:0;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- calendar ---------- */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 18px}
.calhd{text-align:center;font-size:11px;color:var(--text3);font-weight:600;padding-bottom:6px}
.calcell{aspect-ratio:1;background:var(--surface);border-radius:10px;display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:4px;font-size:13px;border:1.5px solid transparent}
.calcell.out{opacity:.25}
.calcell.today{border-color:var(--accent)}
.calcell .marks{display:flex;gap:3px;height:6px}
.calcell .marks i{width:6px;height:6px;border-radius:50%;display:block}

/* ---------- more ---------- */
.mrow{display:flex;align-items:center;gap:14px;padding:18px;border-bottom:1px solid var(--line)}
.mrow .ic{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent)}

/* ---------- daily check-in ---------- */
.ci-date{display:flex;align-items:center;gap:12px;padding:18px 18px 6px}
.ci-date .lbl{flex:1;text-align:center;font-size:17px;font-weight:500}
.ci-prog{padding:0 18px 4px;font-size:13px;color:var(--text2);letter-spacing:.2px}
.q{background:var(--surface);border-radius:16px;margin:12px 18px 0;padding:16px}
.q-l{font-size:16px;font-weight:600}
.q-h{font-size:13px;color:var(--text3);margin-top:3px;line-height:1.4}
.q-in{display:flex;align-items:baseline;gap:10px;margin-top:14px;background:var(--surface2);border-radius:12px;padding:12px 14px}
.q-in input{flex:1;font-size:26px;font-weight:600;width:100%}
.q-in input::placeholder{color:#3F3F3F;font-weight:500}
.q-in .u{font-size:14px;color:var(--text2);font-weight:500}
.q-in:focus-within{outline:1.5px solid var(--accent)}
.q-txt{width:100%;margin-top:14px;background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:15px;min-height:88px;resize:none}
.q-scale{display:flex;gap:8px;margin-top:14px}
.q-scale button{flex:1;height:46px;border-radius:10px;background:var(--surface2);font-size:16px;font-weight:600;color:var(--text2)}
.q-scale button.on{background:var(--accent);color:#141410}
.q-bool{display:flex;gap:10px;margin-top:14px}
.q-bool button{flex:1;height:46px;border-radius:10px;background:var(--surface2);font-size:15px;font-weight:500;color:var(--text2)}
.q-bool button.on{background:var(--accent);color:#141410}

/* ---------- toast ---------- */
.toast{position:fixed;left:18px;right:18px;bottom:calc(var(--safe-b) + 96px);z-index:400;
       background:var(--accent);color:#141410;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600;
       text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastin .22s ease}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- copy-to-day picker ---------- */
.cp-wk{font-size:11px;letter-spacing:.8px;color:var(--text3);font-weight:600;margin:14px 0 8px}
.cp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cp-d{aspect-ratio:.82;background:var(--surface2);border-radius:10px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:2px;border:1.5px solid transparent;padding:2px}
.cp-d .n{font-size:9.5px;letter-spacing:.3px;color:var(--text3);font-weight:600}
.cp-d .d{font-size:14px;font-weight:600}
.cp-d.src{opacity:.35}
.cp-d.on{background:var(--accent);color:#141410;border-color:var(--accent)}
.cp-d.on .n{color:rgba(20,20,16,.7)}
.cp-opt{display:flex;align-items:flex-start;gap:11px;margin:16px 0 4px}
.cp-opt input{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.cp-opt label{font-size:14px;line-height:1.4;color:var(--text2)}

/* ---------- barcode scanner ---------- */
.scanwrap{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column}
.scanwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-ui{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between;
         padding:calc(var(--safe-t) + 14px) 18px calc(var(--safe-b) + 24px)}
.scan-top{display:flex;align-items:center;justify-content:space-between}
.scan-top h3{font-size:18px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.scan-x{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.reticle{align-self:center;width:78%;max-width:320px;aspect-ratio:1.6;border-radius:16px;
         box-shadow:0 0 0 2000px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.85);position:relative}
.reticle::after{content:'';position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--accent);
                box-shadow:0 0 10px var(--accent);animation:sweep 1.9s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-46px)}50%{transform:translateY(46px)}}
.scan-msg{text-align:center;font-size:15px;color:#E6E6E6;text-shadow:0 1px 6px rgba(0,0,0,.9);min-height:22px}
.scan-foot{display:flex;flex-direction:column;gap:10px;align-items:center}
.scan-manual{background:rgba(0,0,0,.55);border-radius:999px;padding:11px 20px;font-size:14px;color:#fff}
.scan-err{margin:auto;max-width:300px;text-align:center;background:rgba(0,0,0,.7);border-radius:14px;padding:20px;font-size:15px;line-height:1.5}
.bcnote{display:flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--accent);
        border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end;animation:fade .18s ease}
.sheet{width:100%;max-height:88vh;background:#121212;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--safe-b));
       overflow-y:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-h h3{font-size:19px;font-weight:600}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;letter-spacing:.3px}
.fld input,.fld textarea{width:100%;background:var(--surface2);border-radius:10px;padding:13px 14px;font-size:16px;color:var(--text)}
.fld4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.libitem{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.libitem .nm{flex:1;min-width:0;font-size:15px}
.libitem .mc{font-size:12px;color:var(--text2);margin-top:3px}
.pill{background:var(--surface2);border-radius:999px;padding:9px 16px;font-size:14px;color:var(--text2)}
.pill.on{background:var(--accent);color:#141410;font-weight:600}
.iconbtn{color:var(--accent)}
.iconbtn.red{color:var(--red)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="hdr" id="hdr"></div>
<div id="app" class="has-hdr"></div>
<nav class="tabbar" id="tabbar"></nav>
<div id="overlay"></div>

<script>
/* ==========================================================================
   ICONS
   ========================================================================== */
const I = {
  home:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-5.5h5V20"/></svg>',
  dumbbell:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8v8M7 6v12M17 6v12M20 8v8M7 12h10"/></svg>',
  avocado:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c3.9 0 6.5 3.4 6.5 7.6 0 5.2-3.1 10.4-6.5 10.4S5.5 15.8 5.5 10.6C5.5 6.4 8.1 3 12 3Z"/><ellipse cx="12" cy="13" rx="2.6" ry="3.2"/></svg>',
  calendar:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>',
  more:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>',
  chev:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',

/* ==========================================================================
   STORAGE
   ========================================================================== */
const KEY = 'jo_app_v2';
const Storage = {
  d: null,
  load() {
    try { this.d = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { this.d = null; }
    if (!this.d) this.d = {};
    const def = { plan:JSON.parse(JSON.stringify(DEFAULT_PLAN)), targetWater:132, nutrition:{}, workouts:{},
                  checkins:{}, weight:{}, steps:{}, water:{}, foods:JSON.parse(JSON.stringify(SEED_FOODS)), name:'Jolyn' };
    for (const k in def) if (this.d[k] === undefined) this.d[k] = def[k];
    this.migrate();
    return this.d;
  },
  // one-time import of workout completions from the previous version of the app
  migrate() {
    if (this.d.migrated) return;
    try {
      const old = JSON.parse(localStorage.getItem('jo_hyrox_app_data') || 'null');
      if (old && old.completedWorkouts) {
        for (const ds in old.completedWorkouts) {
          const w = old.completedWorkouts[ds];
          if (w && w.completed && !this.d.workouts[ds]) {
            this.d.workouts[ds] = { day:'Imported', at: w.timestamp || ds, rpe: w.rpe, notes: w.notes };
            this.d.checkins[ds] = true;
          }
        }
      }
    } catch(e) { /* nothing to import */ }
    this.d.migrated = true;
    this.save();
  },
  save() { try { localStorage.setItem(KEY, JSON.stringify(this.d)); } catch(e) { console.warn('save failed', e); } },

  planTargets() {
    const t = { kcal:0, p:0, c:0, f:0 };
    this.d.plan.meals.forEach(m => { t.kcal += +m.kcal||0; t.p += +m.p||0; t.c += +m.c||0; t.f += +m.f||0; });
    return t;
  },
  day(ds) {
    if (!this.d.nutrition[ds]) {
      this.d.nutrition[ds] = {
        meals: this.d.plan.meals.map(m => ({ name:m.name, kcal:+m.kcal, p:+m.p, c:+m.c, f:+m.f, foods:[], done:false })),
        dayDone: false
      };
      this.save();
    }
    return this.d.nutrition[ds];
  },
  mealTotals(meal) {
    const t = { kcal:0, p:0, c:0, f:0 };
    meal.foods.forEach(x => { t.kcal += x.kcal; t.p += x.p; t.c += x.c; t.f += x.f; });
    return t;
  },
  dayTotals(ds) {
    const t = { kcal:0, p:0, c:0, f:0 };
    this.day(ds).meals.forEach(m => { const mt = this.mealTotals(m); t.kcal+=mt.kcal; t.p+=mt.p; t.c+=mt.c; t.f+=mt.f; });
    return t;
  },
  dayHasFood(ds) {
    const n = this.d.nutrition[ds];
    return !!(n && n.meals.some(m => m.foods.length));
  },
  answers(ds) {
    if (!this.d.answers) this.d.answers = {};
    if (!this.d.answers[ds]) this.d.answers[ds] = {};
    return this.d.answers[ds];
  },
  saveAnswer(ds, q, raw) {
    const a = this.answers(ds);
    const val = (raw === '' || raw == null) ? null
      : (q.type === 'number' || q.type === 'scale') ? (isNaN(parseFloat(raw)) ? null : parseFloat(raw)) : raw;
    if (val === null) delete a[q.id]; else a[q.id] = val;
    if (q.sync === 'weight') { if (val === null) delete this.d.weight[ds]; else this.d.weight[ds] = val; }
    this.save();
  },
  answeredCount(ds) {
    const a = this.answers(ds);
    return CHECKIN_QUESTIONS.filter(q => a[q.id] !== undefined && a[q.id] !== null && a[q.id] !== '').length;
  },
  // a day counts as checked in once every question has an answer
  checkinDone(ds) {
    if (this.d.checkins[ds]) return true;                       // legacy / imported days
    return CHECKIN_QUESTIONS.length > 0 && this.answeredCount(ds) === CHECKIN_QUESTIONS.length;
  },
  streak() {
    let n = 0;
    const d = new Date();
    for (;;) {
      const ds = iso(d);
      if (this.checkinDone(ds)) { n++; d.setDate(d.getDate()-1); }
      else if (n === 0 && ds === iso(new Date())) { d.setDate(d.getDate()-1); }
      else break;
      if (n > 4000) break;
    }
    return n;
  }
};

/* ==========================================================================
   HELPERS
   ========================================================================== */
const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1 = n => Math.round(n*10)/10;
const fmt = n => { const v = r1(n); return Number.isInteger(v) ? String(v) : v.toFixed(1); };
const normBarcode = c => String(c || '').replace(/\D/g, '').replace(/^0+/, '');
const addDays = (ds, n) => { const d = parseISO(ds); d.setDate(d.getDate()+n); return iso(d); };
const dateLabel = ds => ds === today() ? 'Today' : (ds === addDays(today(),-1) ? 'Yesterday'
  : ds === addDays(today(),1) ? 'Tomorrow' : (() => { const d = parseISO(ds); return `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; })());

function rings(vals) {
  // vals: [{val,target,color}] outer -> inner
  const geo = [ {r:89}, {r:67}, {r:45}, {r:23} ];
  const W = 22;
  let out = `<svg class="rings" viewBox="0 0 200 200">`;
  vals.forEach((v, i) => {
    const R = geo[i].r, C = 2*Math.PI*R;
    const pct = v.target > 0 ? Math.min(v.val/v.target, 1) : 0;
    out += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${v.color}" stroke-opacity=".3" stroke-width="${W}"/>`;
    if (pct > 0) out += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${v.color}" stroke-width="${W}"
      stroke-dasharray="${C*pct} ${C}" stroke-linecap="round" transform="rotate(-90 100 100)"/>`;
  });
  return out + '</svg>';
}

function weightChart() {
  const S = Storage.d, keys = Object.keys(S.weight).sort().slice(-4);
  if (!keys.length) return `<div class="dim t-sm" style="margin-top:22px">Tap to log weight</div>`;
  const vals = keys.map(k => S.weight[k]);
  const min = Math.min(...vals)-1, max = Math.max(...vals)+1, span = max-min || 1;
  const pts = vals.map((v,i) => `${(keys.length===1?50:i/(keys.length-1)*100)},${100-((v-min)/span*100)}`).join(' ');
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:48px;margin-top:14px">
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="row" style="justify-content:space-between;margin-top:6px">
      ${keys.map(k => `<span class="t-xs dim">${MON[parseISO(k).getMonth()]} ${parseISO(k).getDate()}</span>`).join('')}
    </div>`;
}

function stepChart() {
  const S = Storage.d, t = today();
  const keys = []; for (let i=6;i>=0;i--) keys.push(addDays(t,-i));
  const vals = keys.map(k => S.steps[k] || 0);
  const max = Math.max(...vals, 1);
  return `<div class="row" style="gap:8px;align-items:flex-end;height:66px;margin-top:14px">
    ${vals.map(v => `<div style="flex:1;background:var(--accent);border-radius:4px 4px 0 0;height:${Math.max(2, v/max*100)}%;${v?'':'opacity:.25'}"></div>`).join('')}
  </div>
  <div class="row" style="justify-content:space-between;margin-top:6px">
    ${keys.map(k => `<span class="t-xs dim" style="flex:1;text-align:center">${DOW[parseISO(k).getDay()][0]}</span>`).join('')}
  </div>`;
}

      {val:tot.kcal,target:tg.kcal,color:'var(--kcal)'},
      {val:tot.p,   target:tg.p,   color:'var(--pro)'},

      <div class="mealhead">

        <div class="micons">

          <button class="iconbtn" onclick="App.copyMealSheet(${mi})">${I.copy}</button>
          <button class="iconbtn red" onclick="App.delMeal(${mi})">${I.trash}</button>
        </div>
      </div>
      <div class="macrohdr">
        ${col(m.foods.length?mt.kcal:null, m.kcal, 'kcal', 'var(--kcal)')}
        ${col(m.foods.length?mt.p:null,    m.p,    'g',    'var(--pro)')}
        ${col(m.foods.length?mt.c:null,    m.c,    'g',    'var(--carb)')}

/* ==========================================================================

   ========================================================================== */
function renderCheckin() {
  const ds = App.checkinDate;
  const a = Storage.answers(ds);
  const atToday = ds >= today();

  const field = q => {
    const v = a[q.id];
    const val = (v === undefined || v === null) ? '' : v;
    if (q.type === 'text')
      return `<textarea class="q-txt" placeholder="${esc(q.placeholder||'')}"
                onchange="App.answer('${q.id}', this.value)">${esc(val)}</textarea>`;
    if (q.type === 'bool')
      return `<div class="q-bool">
          <button class="${val===1?'on':''}" onclick="App.answer('${q.id}', ${val===1?"''":1}); App.render()">Yes</button>
          <button class="${val===0?'on':''}" onclick="App.answer('${q.id}', ${val===0?"''":0}); App.render()">No</button>
        </div>`;
    if (q.type === 'scale') {
      const max = q.max || 5;
      let out = '<div class="q-scale">';
      for (let i = 1; i <= max; i++)
        out += `<button class="${val===i?'on':''}" onclick="App.answer('${q.id}', ${val===i?"''":i}); App.render()">${i}</button>`;
      return out + '</div>';
    }
    return `<div class="q-in">
        <input inputmode="decimal" step="${esc(q.step||'any')}" value="${val}" placeholder="${esc(q.placeholder||'')}"
               oninput="App.answer('${q.id}', this.value)">
        ${q.unit ? `<span class="u">${esc(q.unit)}</span>` : ''}
      </div>`;
  };

  const questions = CHECKIN_QUESTIONS.length
    ? CHECKIN_QUESTIONS.map(q => `<div class="q">
        <div class="q-l">${esc(q.label)}</div>
        ${q.hint ? `<div class="q-h">${esc(q.hint)}</div>` : ''}
        ${field(q)}
      </div>`).join('')
    : `<div class="empty" style="padding:60px 24px">No check-in questions yet.</div>`;

  return `<div class="view">
    <div class="ci-date">
      <button class="arrow" onclick="App.shiftCheckin(-1)">${I.chevL}</button>
      <div class="lbl">${dateLabel(ds)}</div>
      <button class="arrow" onclick="App.shiftCheckin(1)" ${atToday?'style="opacity:.3"':''}>${I.chev}</button>
    </div>
    <div class="ci-prog" id="ciProgress">${Storage.answeredCount(ds)} of ${CHECKIN_QUESTIONS.length} answered</div>
    ${questions}
    <div class="sec" style="margin-top:22px">
      <button class="btn-accent" onclick="App.go('home')">Done</button>
    </div>
    <div style="height:24px"></div>
  </div>`;
}

function renderCalendar() {
  const cur = App.calMonth;
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const ds = iso(d), out = d.getMonth() !== cur.getMonth();
    const w = !!Storage.d.workouts[ds], n = Storage.dayHasFood(ds), c = Storage.checkinDone(ds);
    cells.push(`<button class="calcell ${out?'out':''} ${ds===today()?'today':''}" onclick="App.openDate('${ds}')">
      <div>${d.getDate()}</div>
      <div class="marks">
        ${w?'<i style="background:var(--accent)"></i>':''}
        ${n?'<i style="background:var(--pro)"></i>':''}
        ${c?'<i style="background:var(--kcal)"></i>':''}
      </div>
    </button>`);
  }
  return `<div class="view">
    <div class="datebar">
      <button class="arrow" onclick="App.shiftMonth(-1)">${I.chevL}</button>
      <div class="datelbl" style="flex:1">${MON[cur.getMonth()]} ${cur.getFullYear()}</div>
      <button class="arrow" onclick="App.shiftMonth(1)">${I.chev}</button>
    </div>
    <div class="calgrid" style="margin-top:14px">
      ${['S','M','T','W','T','F','S'].map(x => `<div class="calhd">${x}</div>`).join('')}
    </div>
    <div class="calgrid">${cells.join('')}</div>
    <div class="sec" style="margin-top:20px">
      <div class="card">
        <div class="t-sm muted" style="margin-bottom:10px">Legend</div>
        <div class="row" style="gap:8px;margin-bottom:6px"><i style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:block"></i><span class="t-sm">Workout logged</span></div>
        <div class="row" style="gap:8px;margin-bottom:6px"><i style="width:8px;height:8px;border-radius:50%;background:var(--pro);display:block"></i><span class="t-sm">Food logged</span></div>
        <div class="row" style="gap:8px"><i style="width:8px;height:8px;border-radius:50%;background:var(--kcal);display:block"></i><span class="t-sm">Checked in</span></div>
      </div>
    </div>
    <div style="height:24px"></div>
  </div>`;
}

/* ==========================================================================
   SHEETS
   ========================================================================== */
const Sheet = {
  open(html) {
    document.getElementById('overlay').innerHTML =
      `<div class="scrim" onclick="if(event.target===this)Sheet.close()"><div class="sheet">${html}</div></div>`;
  },
  close() { document.getElementById('overlay').innerHTML = ''; },
  head(title) { return `<div class="sheet-h"><h3>${esc(title)}</h3><button onclick="Sheet.close()">${I.x}</button></div>`; },
  val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; },
  num(id) { const v = parseFloat(this.val(id)); return isNaN(v) ? 0 : v; }
};

/* ==========================================================================
   APP
   ========================================================================== */
const App = {
  view: 'home',
  dayIdx: (new Date().getDay()+6)%7,
  nutDate: today(),
  allDays: false,
  calMonth: new Date(),
  checkinDate: today(),
  fsCtx: null,

  init() {
    Storage.load();
    this.render();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  },
  render() {
    renderHeader();
    renderTabs();
    const body = { home:renderHome, workout:renderWorkout, nutrition:renderNutrition,
                   calendar:renderCalendar, more:renderMore, checkin:renderCheckin }[this.view];
    document.getElementById('app').innerHTML = body();
  },
  go(v) { this.view = v; document.getElementById('app').scrollTop = 0; this.render(); },

  /* ---- home ---- */
  openCheckin(ds) {
    if (ds > today()) return;          // future days are locked
    this.checkinDate = ds;
    this.go('checkin');
  },
  shiftCheckin(n) {
    const next = addDays(this.checkinDate, n);
    if (next > today()) return;
    this.checkinDate = next;
    this.render();
  },
  answer(qid, raw) {
    const q = CHECKIN_QUESTIONS.find(x => x.id === qid);
    if (!q) return;
    Storage.saveAnswer(this.checkinDate, q, raw);
    const badge = document.getElementById('ciProgress');
    if (badge) badge.textContent = `${Storage.answeredCount(this.checkinDate)} of ${CHECKIN_QUESTIONS.length} answered`;
  },
  logWeight() {
    Sheet.open(Sheet.head('Log Weight') +
      `<div class="fld"><label>WEIGHT (LBS)</label><input id="wv" inputmode="decimal" value="${Storage.d.weight[today()]||''}" placeholder="136.6"></div>
       <button class="btn-accent" onclick="App.saveWeight()">Save</button>`);
    setTimeout(()=>document.getElementById('wv').focus(), 80);
  },
  saveWeight() { const v = Sheet.num('wv'); if (v > 0) Storage.d.weight[today()] = v; Storage.save(); Sheet.close(); this.render(); },
  logSteps() {
    Sheet.open(Sheet.head('Log Steps') +
      `<div class="fld"><label>STEPS TODAY</label><input id="sv" inputmode="numeric" value="${Storage.d.steps[today()]||''}" placeholder="8500"></div>
       <button class="btn-accent" onclick="App.saveSteps()">Save</button>`);
    setTimeout(()=>document.getElementById('sv').focus(), 80);
  },
  saveSteps() { const v = Sheet.num('sv'); Storage.d.steps[today()] = Math.max(0, Math.round(v)); Storage.save(); Sheet.close(); this.render(); },
  water(sign) {
    const el = document.getElementById('waterStep');
    const step = el ? (parseFloat(el.value) || 0) : 8;
    const t = today();
    Storage.d.water[t] = Math.max(0, (Storage.d.water[t]||0) + sign*step);
    Storage.save(); this.render();
  },
  setWaterTarget() {
    Sheet.open(Sheet.head('Water Target') +
      `<div class="fld"><label>OUNCES PER DAY</label><input id="wt" inputmode="numeric" value="${Storage.d.targetWater||132}"></div>
       <button class="btn-accent" onclick="App.saveWaterTarget()">Save</button>`);
  },
  saveWaterTarget() { const v = Sheet.num('wt'); if (v > 0) Storage.d.targetWater = v; Storage.save(); Sheet.close(); this.render(); },

  /* ---- workout ---- */
  setDay(i) { this.dayIdx = i; this.render(); },
  openOverview() {
    Sheet.open(Sheet.head(PROGRAM.name) + `<p class="muted" style="line-height:1.6">${esc(PROGRAM.overview)}</p>
      <div style="height:18px"></div><button class="btn-accent" onclick="Sheet.close()">Close</button>`);
  },
  logWorkout() {
    const ds = today();
    if (Storage.d.workouts[ds]) delete Storage.d.workouts[ds];
    else Storage.d.workouts[ds] = { day: PROGRAM.days[this.dayIdx].label, at: new Date().toISOString() };
    Storage.save(); this.render();
  },

  /* ---- nutrition ---- */
  shiftDate(n) { this.nutDate = addDays(this.nutDate, n); this.render(); },
  toggleAllDays() { this.allDays = !this.allDays; this.render(); },
  openPlanNote() { this.go('nutrition'); this.allDays = true; this.render(); },
  jumpToday() { this.calMonth = new Date(); this.render(); },
  openDate(ds) { this.nutDate = ds; this.go('nutrition'); },

  completeMeal(mi) { const d = Storage.day(this.nutDate); d.meals[mi].done = true; Storage.save(); this.render(); },
  reopenMeal(mi)   { const d = Storage.day(this.nutDate); d.meals[mi].done = false; Storage.save(); this.render(); },
  /* ---- copy a meal to other days ---- */
  copySel: null,

  copyMealSheet(mi) {
    this.copySel = new Set();
    this.copyMi = mi;
    this.renderCopySheet();
  },
  renderCopySheet() {
    const mi = this.copyMi;
    const src = Storage.day(this.nutDate).meals[mi];
    const foods = src.foods.length;
    const start = addDays(this.nutDate, -((parseISO(this.nutDate).getDay() + 6) % 7)); // Monday of this week

    let grid = '';
    for (let w = 0; w < 3; w++) {
      const wkStart = addDays(start, w * 7);
      grid += `<div class="cp-wk">${w === 0 ? 'THIS WEEK' : w === 1 ? 'NEXT WEEK' : 'WEEK AFTER'}</div><div class="cp-grid">`;
      for (let i = 0; i < 7; i++) {
        const ds = addDays(wkStart, i), d = parseISO(ds);
        const isSrc = ds === this.nutDate;
        grid += `<button class="cp-d ${isSrc ? 'src' : ''} ${this.copySel.has(ds) ? 'on' : ''}"
            ${isSrc ? 'disabled' : `onclick="App.toggleCopyDay('${ds}')"`}>
            <span class="n">${DOW[d.getDay()]}</span><span class="d">${d.getDate()}</span>
          </button>`;
      }
      grid += '</div>';
    }

    const n = this.copySel.size;
    Sheet.open(Sheet.head('Copy Meal') +
      `<div class="card" style="margin-bottom:4px">
         <div class="t-md w6">${esc(src.name)}</div>
         <div class="t-sm muted" style="margin-top:4px">${foods} ${foods === 1 ? 'food' : 'foods'} · ${fmt(Storage.mealTotals(src).kcal)} kcal</div>
       </div>
       <button class="btn-accent" style="background:var(--surface2);color:var(--text);margin-top:12px"
               onclick="App.dupMeal(${mi}); Sheet.close()">Duplicate in this day</button>
       <div class="cp-wk" style="margin-top:22px">COPY TO</div>
       ${grid}
       <div class="cp-opt">
         <input type="checkbox" id="cpRep" ${this.copyReplace === false ? '' : 'checked'}
                onchange="App.copyReplace = this.checked">
         <label for="cpRep">If that day already has a meal with the same name, fill that one instead of adding another</label>
       </div>
       <button class="btn-accent" style="margin-top:8px;${n ? '' : 'opacity:.4'}"
               ${n ? `onclick="App.doCopyMeal()"` : 'disabled'}>
         ${n ? `Copy to ${n} ${n === 1 ? 'day' : 'days'}` : 'Pick at least one day'}
       </button>`);
  },
  toggleCopyDay(ds) {
    if (this.copySel.has(ds)) this.copySel.delete(ds); else this.copySel.add(ds);
    const sc = document.querySelector('.sheet') ? document.querySelector('.sheet').scrollTop : 0;
    this.renderCopySheet();
    const sh = document.querySelector('.sheet'); if (sh) sh.scrollTop = sc;
  },
  doCopyMeal() {
    const src = Storage.day(this.nutDate).meals[this.copyMi];
    const replace = this.copyReplace !== false;
    const days = [...this.copySel].sort();
    days.forEach(ds => {
      const day = Storage.day(ds);
      const copy = JSON.parse(JSON.stringify(src));
      copy.done = false;
      const slot = replace ? day.meals.findIndex(m => m.name === src.name) : -1;
      if (slot >= 0) { day.meals[slot].foods = copy.foods; day.meals[slot].done = false; }
      else day.meals.push(copy);
      day.dayDone = false;
    });
    Storage.save(); Sheet.close(); this.render();
    this.toast(`Copied to ${days.length} ${days.length === 1 ? 'day' : 'days'}`);
  },
  toast(text) {
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2200);
  },

  dupMeal(mi) {
    const d = Storage.day(this.nutDate);
    d.meals.splice(mi+1, 0, JSON.parse(JSON.stringify(d.meals[mi])));
    Storage.save(); this.render();
  },
  delMeal(mi) {
    const d = Storage.day(this.nutDate);
    if (!confirm(`Delete "${d.meals[mi].name}"?`)) return;
    d.meals.splice(mi, 1); Storage.save(); this.render();
  },
  completeDay() {
    const d = Storage.day(this.nutDate);
    d.dayDone = !d.dayDone;
    if (d.dayDone) d.meals.forEach(m => { if (m.foods.length) m.done = true; });
    Storage.save(); this.render();
  },
  copyYesterday() {
    const prev = Storage.d.nutrition[addDays(this.nutDate,-1)];
    if (!prev) return alert('Nothing logged yesterday.');
    if (!confirm('Copy yesterday’s meals into this day?')) return;
    Storage.d.nutrition[this.nutDate] = JSON.parse(JSON.stringify(prev));
    Storage.d.nutrition[this.nutDate].dayDone = false;
    Storage.d.nutrition[this.nutDate].meals.forEach(m => m.done = false);
    Storage.save(); this.render();
  },
  addMeal() { this.editMealSheet(null); },
  editMeal(mi) { this.editMealSheet(mi); },
  editMealSheet(mi) {
    const d = Storage.day(this.nutDate);
    const m = mi === null ? { name:'', kcal:'', p:'', c:'', f:'' } : d.meals[mi];
    Sheet.open(Sheet.head(mi === null ? 'Add Meal' : 'Edit Meal') +
      `<div class="fld"><label>NAME</label><input id="mn" value="${esc(m.name)}" placeholder="Meal 6"></div>
       <div class="fld"><label>TARGETS</label><div class="fld4">
         <input id="mk" inputmode="decimal" value="${m.kcal}" placeholder="kcal">
         <input id="mp" inputmode="decimal" value="${m.p}" placeholder="P">
         <input id="mc" inputmode="decimal" value="${m.c}" placeholder="C">
         <input id="mf" inputmode="decimal" value="${m.f}" placeholder="F">
       </div></div>
       <button class="btn-accent" onclick="App.saveMeal(${mi===null?'null':mi})">Save</button>`);
  },
  saveMeal(mi) {
    const d = Storage.day(this.nutDate);
    const obj = { name: Sheet.val('mn') || 'Meal', kcal: Sheet.num('mk'), p: Sheet.num('mp'), c: Sheet.num('mc'), f: Sheet.num('mf') };
    if (mi === null) d.meals.push({ ...obj, foods:[], done:false });
    else Object.assign(d.meals[mi], obj);
    Storage.save(); Sheet.close(); this.render();
  },

  /* ---- plan template ---- */
  addPlanMeal() { this.planSheet(null); },
  editPlanMeal(i) { this.planSheet(i); },
  planSheet(i) {
    const m = i === null ? { name:'', kcal:'', p:'', c:'', f:'' } : Storage.d.plan.meals[i];
    Sheet.open(Sheet.head(i === null ? 'Add Template Meal' : 'Edit Template Meal') +
      `<div class="fld"><label>NAME</label><input id="pn" value="${esc(m.name)}"></div>
       <div class="fld"><label>TARGETS</label><div class="fld4">
         <input id="pk" inputmode="decimal" value="${m.kcal}" placeholder="kcal">
         <input id="pp" inputmode="decimal" value="${m.p}" placeholder="P">
         <input id="pc" inputmode="decimal" value="${m.c}" placeholder="C">
         <input id="pf" inputmode="decimal" value="${m.f}" placeholder="F">
       </div></div>
       <button class="btn-accent" onclick="App.savePlanMeal(${i===null?'null':i})">Save</button>`);
  },
  savePlanMeal(i) {
    const obj = { name: Sheet.val('pn') || 'Meal', kcal: Sheet.num('pk'), p: Sheet.num('pp'), c: Sheet.num('pc'), f: Sheet.num('pf') };
    if (i === null) Storage.d.plan.meals.push(obj); else Object.assign(Storage.d.plan.meals[i], obj);
    Storage.save(); Sheet.close(); this.render();
  },
  delPlanMeal(i) {
    if (!confirm('Remove from template?')) return;
    Storage.d.plan.meals.splice(i,1); Storage.save(); this.render();
  },

  /* ---- food ---- */
  addFood(mi) { this.fsCtx = { mi, fi:null }; this.foodSearch(''); },
  editFood(mi, fi) {
    const x = Storage.day(this.nutDate).meals[mi].foods[fi];
    this.fsCtx = { mi, fi };
    this.foodForm({ name:x.name, unit:x.unit, base:x.amount, kcal:x.kcal, p:x.p, c:x.c, f:x.f }, x.amount, true);
  },
  foodSearch(q) {
    const list = Storage.d.foods
      .filter(f => f.name.toLowerCase().includes(q.toLowerCase()))
      .map(f => `<div class="libitem" onclick="App.pickFood('${f.id}')">
          <div class="nm">${esc(f.name)}<div class="mc">${fmt(f.kcal)} kcal · ${fmt(f.p)}P ${fmt(f.c)}C ${fmt(f.f)}F / ${fmt(f.base)} ${esc(f.unit)}</div></div>
          <span class="iconbtn">${I.plus}</span>
        </div>`).join('') || `<div class="empty">No saved food matches.</div>`;
    Sheet.open(Sheet.head('Add Food') +
      `<div class="row" style="gap:10px;margin-bottom:12px">
         <div class="fld" style="flex:1;margin:0"><input id="fq" placeholder="Search your foods…" oninput="App.foodSearchLive(this.value)" value="${esc(q)}"></div>
         <button class="arrow" style="width:50px;height:46px;border-radius:10px;color:var(--accent)" onclick="App.openScanner()">${I.scan}</button>
       </div>
       <div id="flist">${list}</div>
       <div style="height:14px"></div>
       <button class="btn-accent" onclick="App.openScanner()">${I.scan} &nbsp;Scan Barcode</button>
       <div style="height:10px"></div>
       <button class="btn-accent" style="background:var(--surface2);color:var(--text)" onclick="App.foodForm(null,null,false)">+ Create New Food</button>`);
    setTimeout(()=>{ const el = document.getElementById('fq'); if (el) { el.focus(); el.selectionStart = el.value.length; } }, 80);
  },
  foodSearchLive(q) {
    const el = document.getElementById('flist');
    if (!el) return;
    el.innerHTML = Storage.d.foods
      .filter(f => f.name.toLowerCase().includes(q.toLowerCase()))
      .map(f => `<div class="libitem" onclick="App.pickFood('${f.id}')">
          <div class="nm">${esc(f.name)}<div class="mc">${fmt(f.kcal)} kcal · ${fmt(f.p)}P ${fmt(f.c)}C ${fmt(f.f)}F / ${fmt(f.base)} ${esc(f.unit)}</div></div>
          <span class="iconbtn">${I.plus}</span>
        </div>`).join('') || `<div class="empty">No saved food matches.</div>`;
  },
  pickFood(id) {
    const f = Storage.d.foods.find(x => x.id === id);
    if (f) this.foodForm(f, f.base, true);
  },
  findByBarcode(code) {
    const n = normBarcode(code);
    return n ? Storage.d.foods.find(f => f.barcode && normBarcode(f.barcode) === n) : undefined;
  },
  foodForm(f, amount, fromLib, note) {
    const v = f || { name:'', unit:'g', base:100, kcal:'', p:'', c:'', f:'' };
    this.pendingBarcode = (f && f.barcode) || this.pendingBarcode || null;
    Sheet.open(Sheet.head(fromLib ? 'Add to Meal' : 'New Food') +
      (note ? `<div class="bcnote">${I.scan}<span>${esc(note)}</span></div>` : '') +
      `<div class="fld"><label>FOOD</label><input id="xn" value="${esc(v.name)}" placeholder="Cavatappi by banza"></div>
       <div class="fld"><label>MACROS PER SERVING</label><div class="fld4">
         <input id="xb" inputmode="decimal" value="${v.base}" placeholder="amt">
         <input id="xu" value="${esc(v.unit)}" placeholder="g">
         <input id="xk" inputmode="decimal" value="${v.kcal}" placeholder="kcal">
         <input id="xp" inputmode="decimal" value="${v.p}" placeholder="P">
       </div></div>
       <div class="fld"><div class="fld4" style="grid-template-columns:1fr 1fr">
         <input id="xc" inputmode="decimal" value="${v.c}" placeholder="Carbs g">
         <input id="xf" inputmode="decimal" value="${v.f}" placeholder="Fat g">
       </div></div>
       <div class="fld"><label>AMOUNT TO LOG</label><input id="xa" inputmode="decimal" value="${amount!=null?amount:v.base}"></div>
       ${fromLib ? '' : `<div class="fld row" style="gap:10px"><input type="checkbox" id="xs" checked style="width:20px;height:20px"><label style="margin:0">Save to my food library</label></div>`}
       <button class="btn-accent" onclick="App.saveFood(${fromLib})">${this.fsCtx && this.fsCtx.fi !== null ? 'Update' : 'Add to Meal'}</button>
       ${this.fsCtx && this.fsCtx.fi !== null ? `<div style="height:10px"></div><button class="btn-accent" style="background:var(--red);color:#fff" onclick="App.deleteFoodEntry()">Remove from Meal</button>` : ''}`);
  },
  saveFood(fromLib) {
    const base = Sheet.num('xb') || 1, amt = Sheet.num('xa') || base, k = amt / base;
    const entry = {
      name: Sheet.val('xn') || 'Food', amount: amt, unit: Sheet.val('xu') || 'g',
      kcal: Sheet.num('xk')*k, p: Sheet.num('xp')*k, c: Sheet.num('xc')*k, f: Sheet.num('xf')*k
    };
    const cb = document.getElementById('xs');
    if (!fromLib && cb && cb.checked) {
      Storage.d.foods.push({ id:'u'+Date.now(), name:entry.name, base, unit:entry.unit,
        kcal:Sheet.num('xk'), p:Sheet.num('xp'), c:Sheet.num('xc'), f:Sheet.num('xf'),
        barcode: this.pendingBarcode || undefined });
    }
    this.pendingBarcode = null;
    const meal = Storage.day(this.nutDate).meals[this.fsCtx.mi];
    if (this.fsCtx.fi === null) meal.foods.push(entry); else meal.foods[this.fsCtx.fi] = entry;
    Storage.save(); Sheet.close(); this.render();
  },
  deleteFoodEntry() {
    const meal = Storage.day(this.nutDate).meals[this.fsCtx.mi];
    meal.foods.splice(this.fsCtx.fi, 1);
    Storage.save(); Sheet.close(); this.render();
  },
  /* ---- barcode scanning ---- */
  pendingBarcode: null,
  _reader: null,

  loadZXing() {
    if (window.ZXing) return Promise.resolve();
    if (this._zxingPromise) return this._zxingPromise;
    this._zxingPromise = new Promise((res, rej) => {
      const t = document.createElement('script');
      t.src = 'vendor/zxing.min.js';
      t.onload = res;
      t.onerror = () => rej(new Error('Could not load the scanner. Connect to the internet once and it will be cached.'));
      document.head.appendChild(t);
    });
    return this._zxingPromise;
  },

  openScanner() {
    document.getElementById('overlay').innerHTML = `
      <div class="scanwrap" id="scanwrap">
        <video id="scanvid" playsinline muted autoplay></video>
        <div class="scan-ui">
          <div class="scan-top">
            <h3>Scan Barcode</h3>
            <button class="scan-x" onclick="App.closeScanner()">${I.x}</button>
          </div>
          <div class="reticle"></div>
          <div class="scan-foot">
            <div class="scan-msg" id="scanmsg">Starting camera…</div>
            <button class="scan-manual" onclick="App.manualBarcode()">Enter barcode by hand</button>
          </div>
        </div>
      </div>`;
    this.startScan();
  },

  async startScan() {
    const msg = t => { const el = document.getElementById('scanmsg'); if (el) el.textContent = t; };
    try {
      await this.loadZXing();
    } catch (e) { return this.scanError(e.message); }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      return this.scanError('This browser cannot use the camera. Enter the barcode by hand instead.');

    const Z = window.ZXing;
    const hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [
      Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8,
      Z.BarcodeFormat.UPC_A,  Z.BarcodeFormat.UPC_E,
      Z.BarcodeFormat.CODE_128
    ]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    this._reader = new Z.BrowserMultiFormatReader(hints, 300);

    try {
      msg('Point at the barcode');
      await this._reader.decodeFromConstraints(
        { video: { facingMode: { ideal: 'environment' }, width:{ideal:1280}, height:{ideal:720} } },
        'scanvid',
        (result, err) => {
          if (!result) return;
          if (navigator.vibrate) navigator.vibrate(40);
          const code = result.getText().replace(/\D/g, '');
          if (!code) return;
          this.stopScan();
          this.onBarcode(code);
        }
      );
    } catch (e) {
      const denied = /NotAllowed|Permission/i.test(e && (e.name + e.message));
      this.scanError(denied
        ? 'Camera access was blocked. Allow the camera in Settings → Safari, or enter the barcode by hand.'
        : 'Could not start the camera. Enter the barcode by hand instead.');
    }
  },

  scanError(text) {
    const w = document.getElementById('scanwrap');
    if (!w) return;
    w.innerHTML = `<div class="scan-ui">
        <div class="scan-top"><h3>Scan Barcode</h3>
          <button class="scan-x" onclick="App.closeScanner()">${I.x}</button></div>
        <div class="scan-err">${esc(text)}</div>
        <div class="scan-foot"><button class="scan-manual" onclick="App.manualBarcode()">Enter barcode by hand</button></div>
      </div>`;
  },

  stopScan() {
    try { if (this._reader) this._reader.reset(); } catch(e) {}
    const v = document.getElementById('scanvid');
    if (v && v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
    this._reader = null;
  },
  closeScanner() { this.stopScan(); Sheet.close(); },

  manualBarcode() {
    this.stopScan();
    Sheet.open(Sheet.head('Enter Barcode') +
      `<div class="fld"><label>BARCODE NUMBER</label><input id="bc" inputmode="numeric" placeholder="028400433303"></div>
       <button class="btn-accent" onclick="App.onBarcode(Sheet.val('bc'))">Look Up</button>`);
    setTimeout(()=>{ const el=document.getElementById('bc'); if (el) el.focus(); }, 80);
  },

  async onBarcode(code) {
    code = String(code || '').replace(/\D/g, '');
    if (!code) return;
    this.pendingBarcode = code;

    // already in her library -> straight to the amount step
    const known = this.findByBarcode(code);
    if (known) return this.foodForm(known, known.base, true);

    Sheet.open(Sheet.head('Looking Up…') +
      `<div class="empty" style="padding:40px 0">Searching for barcode<br><b>${esc(code)}</b></div>`);

    const food = await this.lookupBarcode(code);
    if (food) {
      this.foodForm(food, food.serving || food.base, false, `Found: ${food.name}. Check the numbers before saving.`);
    } else {
      this.foodForm({ name:'', unit:'g', base:100, kcal:'', p:'', c:'', f:'', barcode:code },
        100, false, `Barcode ${code} is not in the food database. Enter it once and it will be remembered.`);
    }
  },

  async lookupBarcode(code) {
    try {
      const url = 'https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) +
                  '.json?fields=product_name,brands,quantity,serving_size,serving_quantity,nutriments';
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 9000);
      const r = await fetch(url, { signal: ctl.signal });
      clearTimeout(timer);
      if (!r.ok) return null;
      const d = await r.json();
      if (d.status !== 1 || !d.product) return null;

      const p = d.product, n = p.nutriments || {};
      const kcal = n['energy-kcal_100g'];
      if (kcal === undefined || kcal === null) return null;

      const liquid = /ml|l\b/i.test(p.serving_size || p.quantity || '');
      const name = [p.product_name, p.brands ? p.brands.split(',')[0].trim() : ''].filter(Boolean).join(' by ');
      const sq = parseFloat(p.serving_quantity);

      return {
        name: name || ('Barcode ' + code),
        base: 100,
        unit: liquid ? 'ml' : 'g',
        kcal: r1(kcal),
        p: r1(n.proteins_100g || 0),
        c: r1(n.carbohydrates_100g || 0),
        f: r1(n.fat_100g || 0),
        serving: (!isNaN(sq) && sq > 0) ? sq : 100,
        barcode: code
      };
    } catch (e) { return null; }
  },

  openLibrary() {
    const list = Storage.d.foods.map(f => `<div class="libitem">
        <div class="nm">${esc(f.name)}<div class="mc">${fmt(f.kcal)} kcal · ${fmt(f.p)}P ${fmt(f.c)}C ${fmt(f.f)}F / ${fmt(f.base)} ${esc(f.unit)}</div></div>
        <button class="iconbtn red" onclick="App.delLibFood('${f.id}')">${I.trash}</button>
      </div>`).join('') || `<div class="empty">Library is empty.</div>`;
    Sheet.open(Sheet.head('Food Library') + list);
  },
  delLibFood(id) {
    Storage.d.foods = Storage.d.foods.filter(f => f.id !== id);
    Storage.save(); this.openLibrary(); this.render();
  },

  /* ---- calendar ---- */
  shiftMonth(n) { this.calMonth = new Date(this.calMonth.getFullYear(), this.calMonth.getMonth()+n, 1); this.render(); },

  /* ---- more ---- */
  exportData() {
    const blob = new Blob([JSON.stringify(Storage.d, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `jo-app-backup-${today()}.json`;
    a.click();
  },
  resetAll() {
    if (!confirm('Erase all data on this device?')) return;
    localStorage.removeItem(KEY); Storage.load(); this.go('home');
  }
};
App.init();
</script>
</body>
